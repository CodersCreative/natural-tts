[package]
name = "natural-tts"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["Creative Coders <officialccoders@gmail.com>"]
description = "High-level bindings to a variety of text-to-speech libraries."
repository = "https://github.com/CodersCreative/natural-tts"
readme = "README.md"
publish = true
keywords = ["text-to-speech", "coqui-ai", "gtts", "parler", "tts"]
categories = ["science", "api-bindings"]

[features]
meta = ["dep:rand", "dep:tracing-chrome", "dep:tracing-subscriber", "dep:serde_json", "dep:hf-hub", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
tts-rs = ["dep:tts"]
coqui = ["dep:pyo3"]
parler = ["dep:tokenizers", "meta"]
gtts = ["dep:percent-encoding", "dep:minreq"]
msedge = ["dep:msedge-tts"]
py_tts = ["coqui"]
non_py_tts = ["parler", "msedge", "tts-rs", "gtts"]
default = ["gtts"]

metal = ["candle-nn/metal", "candle-transformers/metal", "candle-core/metal"]
cuda = ["candle-nn/cuda", "candle-transformers/cuda","candle-core/cuda"]
cudnn = ["candle-nn/cudnn", "candle-transformers/cudnn","candle-core/cudnn"]
mkl = ["candle-nn/mkl", "candle-transformers/mkl","candle-core/mkl"]
accelerate = ["candle-nn/accelerate", "candle-transformers/accelerate","candle-core/accelerate"]

[dependencies]
candle-core = { version = "0.9.1", optional = true }
candle-nn = { version = "0.9.1", optional = true }
candle-transformers = { version = "0.9.1", optional = true}
derive_builder = { version = "0.20.2"}
hf-hub = {version = "0.4.3", optional = true}
hound = {version = "3.5.1"}
msedge-tts = {version = "0.2.4", optional = true}
pyo3 = { version = "0.27.2", features = ["auto-initialize"], optional = true}
rand = {version = "0.9.2", optional = true}
rodio = {version = "0.21.1"}
serde = "1.0.228"
percent-encoding = {version = "2.3.2", optional = true}
minreq = { version="2.14.1", features=["https"], optional = true }
serde_json = {version = "1.0.148", optional = true}
thiserror = {version = "2.0.17"}
tokenizers = {version = "0.22.2", optional = true}
tracing-chrome = {version = "0.7.2", optional = true}
tracing-subscriber = {version = "0.3.22", optional = true}
tts = {version = "0.26.3", optional = true}
